@media (prefers-color-scheme: dark){
  :root{--paper:#121614;--card:#1B211E;--ink:#E9EEEA;--muted:#9AA69F;--line:#2C3531;
    --roast:#3A2416;--roast-2:#C9A27E;--crema:#D9C3AC;--stamp:#8F9BFF;--ok:#6FCF97;--ok-bg:#1C3326;
    --warn:#F2B25C;--warn-bg:#3A2A12;--danger:#FF8A80;--danger-bg:#3A1C1A}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.demo{background:var(--warn-bg);color:var(--warn);font-size:14px;padding:8px 16px;text-align:center}

/* Header */
.top{background:var(--roast);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello{font-size:15px;color:var(--crema)}
.date{font-family:var(--cond);font-weight:700;font-size:clamp(22px,6.5vw,30px);line-height:1.05;margin-top:2px}
.logo{display:block;flex:none;width:112px;aspect-ratio:360/267;background:var(--roast-2);
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo.sm{width:46px;background:#fff}
.id{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.topbtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.linkbtn{white-space:nowrap;background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
.tabs{display:flex;margin-top:14px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--crema);padding:12px 4px 10px;font-weight:600;font-size:15px;cursor:pointer}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:#fff}

/* Search + customer list */
.search{position:sticky;top:0;z-index:4;background:var(--paper);padding:12px 16px;border-bottom:1px solid var(--line)}
.search input{width:100%;height:50px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;font-size:17px}
.search input:focus{border-color:var(--roast-2);outline:none}
.count{font-size:13px;color:var(--muted);margin-top:6px}
.cust{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;cursor:pointer}
.cust:active{background:var(--card)}
.cust .name{font-weight:600;font-size:17px;line-height:1.25}
.cust .sub{color:var(--muted);font-size:14px}
.minstamp{margin-left:auto;flex:none;font-family:var(--cond);font-weight:700;font-size:17px;color:var(--stamp);
  border:2px solid var(--stamp);border-radius:5px;padding:0 6px;transform:rotate(-4deg)}
.minstamp.pending{color:var(--warn);border-color:var(--warn)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

/* Entries */
.list-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);gap:12px}
.list-head b{font-size:17px}
.list-head input[type=date]{height:44px;border:2px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--line)}
.entry .t{font-family:var(--cond);font-weight:700;font-size:28px;line-height:1;min-width:66px}
.entry .c{font-weight:600;font-size:17px;line-height:1.25}
.entry .n{color:var(--muted);font-size:14px}
.entry.void .t,.entry.void .c{text-decoration:line-through;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--line);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
.smallbtn{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--danger)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);
  border-radius:18px 18px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0;font-size:24px;line-height:1.2}
.sheet .addr{color:var(--muted);margin-top:4px;font-size:15px}
.sheet .addr a{color:var(--stamp)}
.field{margin-top:18px}
.field label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.field .req{color:var(--danger)}
.field.bad input{border-color:var(--danger)}
.field .hint{font-size:13px;color:var(--danger);margin-top:4px}
.field input{width:100%;height:50px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:0 14px;font-size:17px}
.gps{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.search{background:var(--warn);animation:blink 1s infinite}
.dot.ok{background:var(--ok)}
.dot.off{background:var(--danger)}
@keyframes blink{50%{opacity:.3}}
.primary{display:block;width:100%;height:60px;margin-top:18px;border:0;border-radius:14px;background:var(--roast);color:#fff;
  font-family:var(--cond);font-weight:700;font-size:24px;letter-spacing:.3px;cursor:pointer}
.primary:disabled{opacity:.6}
.ghost{display:block;width:100%;height:48px;margin-top:8px;border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer}

/* Stamp confirmation */
.stampview{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.stamp{border:5px solid var(--stamp);color:var(--stamp);border-radius:14px;padding:16px 26px 14px;transform:rotate(-7deg);
  font-family:var(--cond);animation:thunk .32s cubic-bezier(.2,1.6,.4,1) both;max-width:100%}
.stamp .w{font-weight:800;font-size:42px;letter-spacing:4px;line-height:1}
.stamp .h{font-weight:800;font-size:84px;line-height:.95;margin-top:6px}
.stamp .d{font-weight:600;font-size:19px;margin-top:4px}
@keyframes thunk{from{transform:rotate(-7deg) scale(1.7);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.stampview .who{margin-top:34px;font-size:20px;font-weight:600}
.stampview .by{color:var(--muted);margin-top:2px}
.sync{margin-top:14px;font-size:15px;font-weight:600}
.sync.ok{color:var(--ok)} .sync.warn{color:var(--warn)} .sync.danger{color:var(--danger)}
.stampview .primary{max-width:360px}

/* Login */
.login{padding:calc(40px + env(safe-area-inset-top,0px)) 20px 32px;flex:1}
.brand{font-family:var(--cond);font-weight:800;font-size:44px;line-height:1;color:var(--roast-2)}
.brand-sub{color:var(--muted);margin-top:6px;font-size:17px}
.who-list{margin-top:28px;display:grid;gap:10px}
.who-btn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:62px;padding:10px 16px;border:2px solid var(--line);
  border-radius:14px;background:var(--card);cursor:pointer;text-align:left}
.who-btn b{font-size:18px}
.who-btn span{color:var(--muted);font-size:14px}
.who-btn[aria-pressed="true"]{border-color:var(--roast-2)}
.pin{letter-spacing:8px;text-align:center;font-size:24px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.err{color:var(--danger);margin-top:10px;font-weight:600}

/* Istirahat */
.breakbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.breakbar .bl{font-size:14px;color:var(--muted);line-height:1.3}
.breakbar .bl b{color:var(--ink);font-size:15px}
.breakbar.on{background:var(--warn-bg)}
.breakbar.on .bl b{color:var(--warn)}
.breakbar.over{background:var(--danger-bg)}
.breakbar.over .bl b{color:var(--danger)}
.bbtn{flex:none;border:2px solid var(--roast-2);background:none;color:var(--roast-2);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}
.bbtn.solid{background:var(--roast);border-color:var(--roast);color:#fff}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--roast)}
.check .rest{margin-left:auto;color:var(--muted);font-size:14px}
.breakview{position:fixed;inset:0;z-index:25;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.breakview .lbl{font-size:18px;color:var(--muted)}
.breakview .clock{font-family:var(--cond);font-weight:800;font-size:96px;line-height:1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.breakview .clock.warn{color:var(--warn)} .breakview .clock.over{color:var(--danger)}
.breakview .sub{font-size:17px}
.breakview .names{margin-top:20px;display:grid;gap:4px;font-size:16px;color:var(--muted)}
.breakview .primary{max-width:360px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px)}
.spinner{padding:60px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="spinner">Memuat…</div></div>

<script>
/* ====================== KONFIGURASI ======================
   Tempel URL Web App dari Apps Script (Deploy → Web app) di bawah.
   Selama belum diisi, aplikasi jalan dalam MODE DEMO (data tidak disimpan). */
const API_URL = 'https://script.google.com/macros/s/AKfycbxCwap8QfmmM9awoHkbDWcLCdF-p1vx5BtrI_-YtCCUTEzNpN8vrerAzmYRX-tGTuzvzg/exec';

const TZ = 'Asia/Makassar';
const BATAL_MENIT = 15;
const DEMO = !/^https:\/\/script\.google\.com\//.test(API_URL);

/* ====================== UTIL ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const ymd = d => new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const hms = d => new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d);
const longDate = s => new Intl.DateTimeFormat('id-ID',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(s+'T12:00:00+08:00'));
const shortDate = s => new Intl.DateTimeFormat('id-ID',{timeZone:TZ,weekday:'long',day:'numeric',month:'short'}).format(new Date(s+'T12:00:00+08:00'));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ====================== API ====================== */
async function api(action, body = {}){
  if (DEMO) return demoApi(action, body);
  let res;
  try{
    // Content-Type text/plain (bawaan) supaya tidak kena CORS preflight di Apps Script
    res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action, ...body }) });
  }catch(e){ const err = new Error('Tidak ada sinyal / server tidak terjangkau.'); err.network = true; throw err; }
  let data;
  try{ data = await res.json(); }catch{ const err = new Error('Balasan server tidak terbaca.'); err.network = true; throw err; }
  if (!data.ok){ const err = new Error(data.error || 'Terjadi kesalahan.'); err.server = true; throw err; }
  return data;
}

/* ====================== STATE ====================== */
const state = {
  screen: 'boot', tab: 'antar',
  customers: LS.get('hbd_customers', []),
  couriers: LS.get('hbd_couriers', []),
  session: LS.get('hbd_session', null),     // {kurirId, nama, pin}
  queue: LS.get('hbd_queue', []),           // kiriman & istirahat yang belum sampai server
  brk: LS.get('hbd_break', { date: null, used: {}, active: null }), // used: menit per nama (huruf kecil)
  today: ymd(new Date()),
  todayList: [], histDate: null, histList: [], histLoading: false,
  search: '', selected: null, pickCourier: null, loginErr: ''
};
const saveQueue = () => LS.set('hbd_queue', state.queue);
const me = () => state.couriers.find(c => c.id === state.session?.kurirId);
const needSupir = () => !!me()?.supirManual && !(state.session.supir && state.session.supirDate === state.today);
const afterAuthScreen = () => needSupir() ? 'supir' : 'main';
const crew = () => me()?.supirManual ? [state.session.supir, state.session.pendamping].filter(Boolean) : [state.session.nama];
const crewLabel = () => crew().join(' & ');
const JATAH = 60;
const saveBrk = () => LS.set('hbd_break', state.brk);
function brkReset(){ if (state.brk.date !== state.today){ state.brk = { date: state.today, used: {}, active: null }; saveBrk(); } }
function mergeBreaks(b){
  if (!b) return;
  brkReset();
  for (const [k, v] of Object.entries(b.used || {})) state.brk.used[k] = Math.max(state.brk.used[k] || 0, v);
  const pendingStart = state.queue.some(q => q.action === 'breakStart');
  const pendingEnd = state.queue.some(q => q.action === 'breakEnd');
  if (b.active && !state.brk.active && !pendingEnd) state.brk.active = { ...b.active, alerted: [] };  // istirahat dimulai dari HP lain
  if (!b.active && state.brk.active && !pendingStart) state.brk.active = null;                       // sudah ditutup di server
  saveBrk();
}
const onBreak = n => !!state.brk.active?.names.some(x => x.toLowerCase() === n.toLowerCase());
const usedMin = n => (state.brk.used[n.toLowerCase()] || 0);
function remainingSec(n){
  let r = (JATAH - usedMin(n)) * 60;
  if (onBreak(n)) r -= Math.floor((Date.now() - state.brk.active.startAt) / 1000);
  return r;
}
const fmtClock = sec => { const a = Math.abs(sec); return (sec < 0 ? '+' : '') + Math.floor(a/60) + ':' + String(a%60).padStart(2,'0'); };
const fmtMin = sec => sec >= 0 ? `sisa ${Math.floor(sec/60)} mnt` : `lewat ${Math.ceil(-sec/60)} mnt`;

/* ====================== GPS ====================== */
const gps = { watch: null, best: null, status: 'idle' };
function gpsStart(){
  gps.best = null;
  if (!('geolocation' in navigator)){ gps.status = 'off'; return updateGps(); }
  gps.status = 'search'; updateGps();
  gps.watch = navigator.geolocation.watchPosition(p => {
    const c = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy), t: Date.now() };
    if (!gps.best || c.acc <= gps.best.acc || Date.now() - gps.best.t > 20000) gps.best = c;
    gps.status = 'ok'; updateGps();
  }, e => { if (!gps.best){ gps.status = e.code === 1 ? 'denied' : 'off'; updateGps(); } },
  { enableHighAccuracy: true, maximumAge: 15000, timeout: 20000 });
}
function gpsStop(){ if (gps.watch != null) navigator.geolocation.clearWatch(gps.watch); gps.watch = null; }
function updateGps(){
  const el = $('#gps'); if (!el) return;
  const m = {
    idle:   ['', 'GPS belum aktif'],
    search: ['search', 'Mencari lokasi…'],
    ok:     ['ok', gps.best ? `Lokasi terkunci, akurasi ±${gps.best.acc} m` : 'Lokasi terkunci'],
    denied: ['off', 'Izin lokasi ditolak. Kiriman tetap tercatat tanpa titik.'],
    off:    ['off', 'Lokasi tidak tersedia. Kiriman tetap tercatat tanpa titik.']
  }[gps.status];
  el.innerHTML = `<span class="dot ${m[0]}"></span><span>${esc(m[1])}</span>`;
}

/* ====================== DATA ====================== */
async function loadInit(){
  try{
    const d = await api('init');
    state.customers = d.customers; state.couriers = d.couriers;
    LS.set('hbd_customers', d.customers); LS.set('hbd_couriers', d.couriers);
    // Data kurir terbaru bisa mengubah aturan (mis. Supir Manual baru diaktifkan) → cek ulang layar
    if (state.session){
      if (!state.couriers.some(c => c.id === state.session.kurirId)) return logout('Akun kurir tidak aktif lagi. Pilih ulang.');
      if (state.screen === 'main' && needSupir()){ closeSheet(); state.screen = 'supir'; }
      if (state.screen === 'main' || state.screen === 'supir') render();
    } else if (state.screen === 'login') render();
  }catch(e){
    if (!state.customers.length) toast('Gagal memuat data: ' + e.message);
  }
}
async function loadToday(){
  if (!state.session) return;
  try{
    const d = await api('list', { kurirId: state.session.kurirId, pin: state.session.pin, date: state.today });
    state.todayList = d.entries;
    LS.set('hbd_today', { date: state.today, entries: d.entries });
    mergeBreaks(d.breaks);
  }catch(e){
    const c = LS.get('hbd_today', null);
    if (c && c.date === state.today) state.todayList = c.entries;
    if (e.server && /PIN|Kurir/.test(e.message)) return logout(e.message);
  }
  if (state.screen === 'main') render();
}

let flushing = false;
async function flushQueue(){
  if (flushing || !state.queue.length || !state.session) return;
  flushing = true;
  try{
    for (const q of [...state.queue]){
      try{
        const action = q.action || 'deliver';
        const d = await api(action, { ...q, pin: state.session.pin, offline: q.tries > 0 });
        state.queue = state.queue.filter(x => x.qid ? x.qid !== q.qid : x.uid !== q.uid);
        if (action === 'deliver' && d.entry.tanggal === state.today && !state.todayList.some(e => e.uid === d.entry.uid)) state.todayList.push(d.entry);
        if (action !== 'deliver' && d.breaks){ saveQueue(); mergeBreaks(d.breaks); }
      }catch(e){
        q.tries = (q.tries || 0) + 1;
        if (e.network) break;
        q.error = e.message;
      }
      saveQueue();
    }
  } finally { flushing = false; }
  state.todayList.sort((a,b) => a.jam.localeCompare(b.jam));
  LS.set('hbd_today', { date: state.today, entries: state.todayList });
  if (state.screen === 'main' && !state.selected && !$('#brksheet')) render();
}

/* Gabungan: yang sudah di server + yang masih antri di HP */
function todayMerged(){
  const pend = state.queue.filter(q => !q.action && q.tanggal === state.today && q.kurirId === state.session?.kurirId)
    .map(q => ({ uid:q.uid, jam:q.jam, customer:q.customerName, customerId:q.customerId, catatan:q.catatan, penerima:q.penerima, supir:q.supir, pendamping:q.pendamping, pending:true, error:q.error }));
  return [...state.todayList, ...pend].sort((a,b) => a.jam.localeCompare(b.jam));
}
function deliveredToday(){
  const m = {};
  for (const e of todayMerged()) if (e.status !== 'Dibatalkan') m[e.customerId] = e;
  return m;
}

/* ====================== AKSI ====================== */
async function markDelivered(){
  const c = state.selected; if (!c) return;
  if (needSupir()){ closeSheet(); state.screen = 'supir'; return render(); }
  const penerima = ($('#penerima')?.value || '').trim().replace(/\s+/g, ' ');
  if (penerima.length < 2){
    const f = $('#f-penerima'); f.classList.add('bad');
    if (!f.querySelector('.hint')) f.insertAdjacentHTML('beforeend', '<div class="hint" role="alert">Tulis nama orang yang menerima barang.</div>');
    return $('#penerima').focus();
  }
  const mem = LS.get('hbd_penerima', {});
  mem[c.id] = [penerima, ...(mem[c.id] || []).filter(n => n.toLowerCase() !== penerima.toLowerCase())].slice(0, 4);
  LS.set('hbd_penerima', mem);
  const btn = $('#go'); btn.disabled = true; btn.textContent = 'Mencatat…';
  if (!gps.best && gps.status === 'search'){
    btn.textContent = 'Menunggu GPS…';
    const until = Date.now() + 6000;
    while (!gps.best && gps.status === 'search' && Date.now() < until) await sleep(250);
  }
  const now = new Date();
  const item = {
    uid: uuid(), kurirId: state.session.kurirId, customerId: c.id, customerName: c.nama,
    catatan: ($('#note')?.value || '').trim(), penerima, supir: state.session.supir || '', pendamping: state.session.pendamping || '', deliveredAt: now.toISOString(),
    tanggal: ymd(now), jam: hms(now),
    lat: gps.best?.lat ?? null, lng: gps.best?.lng ?? null, acc: gps.best?.acc ?? null, tries: 0
  };
  gpsStop();
  state.queue.push(item); saveQueue();
  state.selected = null;
  showStamp(item);
  await flushQueue();
  const still = state.queue.find(q => q.uid === item.uid);
  const el = $('#sync'); if (!el) return;
  if (!still){ el.className = 'sync ok'; el.textContent = DEMO ? 'Tersimpan (mode demo, tidak masuk Sheet).' : 'Tersimpan di Google Sheet.'; }
  else if (still.error){ el.className = 'sync danger'; el.textContent = 'Belum tersimpan: ' + still.error; }
  else { el.className = 'sync warn'; el.textContent = 'Tersimpan di HP. Akan terkirim otomatis saat ada sinyal.'; }
}

async function cancelEntry(uid){
  if (!confirm('Batalkan catatan kiriman ini?')) return;
  try{
    const d = await api('cancel', { kurirId: state.session.kurirId, pin: state.session.pin, uid });
    state.todayList = state.todayList.map(e => e.uid === uid ? d.entry : e);
    toast('Catatan dibatalkan.'); render();
  }catch(e){ toast(e.message); }
}
function dropPending(uid){
  if (!confirm('Hapus catatan yang belum terkirim ini?')) return;
  state.queue = state.queue.filter(q => q.uid !== uid); saveQueue(); render();
}

async function loadHistory(date){
  state.histDate = date; state.histLoading = true; render();
  try{
    const d = await api('list', { kurirId: state.session.kurirId, pin: state.session.pin, date });
    state.histList = d.entries;
  }catch(e){ state.histList = []; toast(e.message); }
  state.histLoading = false; render();
}

async function doLogin(){
  const pin = ($('#pin')?.value || '').trim();
  const k = state.pickCourier; if (!k || !pin) return;
  const b = $('#login-go'); b.disabled = true; b.textContent = 'Memeriksa…';
  try{
    const d = await api('login', { kurirId: k.id, pin });
    state.session = { kurirId: d.kurir.id, nama: d.kurir.nama, pin };
    LS.set('hbd_session', state.session);
    state.tab = 'antar'; state.loginErr = '';
    state.screen = afterAuthScreen();
    render(); loadToday(); flushQueue();
  }catch(e){
    state.loginErr = e.message; render();
  }
}
function saveSupir(){
  const clean = v => String(v || '').trim().replace(/\s+/g, ' ');
  const name = clean($('#supir')?.value), dua = clean($('#pendamping')?.value);
  if (name.length < 2){ state.loginErr = 'Tulis nama supir dulu.'; return render(); }
  if (dua && dua.toLowerCase() === name.toLowerCase()){ state.loginErr = 'Nama supir dan pendamping tidak boleh sama.'; return render(); }
  if (state.brk.active){ state.loginErr = 'Selesaikan istirahat dulu sebelum ganti kru.'; return render(); }
  state.session.supir = name; state.session.pendamping = dua; state.session.supirDate = state.today;
  LS.set('hbd_session', state.session);
  let recent = LS.get('hbd_supir_names', []);
  for (const n of [dua, name].filter(Boolean)) recent = [n, ...recent.filter(x => x.toLowerCase() !== n.toLowerCase())];
  LS.set('hbd_supir_names', recent.slice(0, 10));
  state.loginErr = ''; state.screen = 'main'; state.tab = 'antar';
  render(); loadToday(); flushQueue();
}
function logout(msg){
  state.session = null; LS.del('hbd_session'); LS.del('hbd_today'); LS.del('hbd_break'); state.brk = { date: null, used: {}, active: null };
  state.todayList = []; state.screen = 'login'; state.pickCourier = null; state.loginErr = msg || '';
  render();
}

/* ====================== RENDER ====================== */
function render(){
  const app = $('#app');
  const demo = DEMO ? `<div class="demo">Mode demo: data tidak disimpan. Isi API_URL di index.html untuk menyambung ke Google Sheet.</div>` : '';
  if (state.screen === 'login') { app.innerHTML = demo + loginHTML(); return; }
  if (state.screen === 'supir') { app.innerHTML = demo + supirHTML(); setTimeout(() => $('#supir')?.focus(), 30); return; }
  if (state.screen !== 'main') return;
  const n = todayMerged().filter(e => e.status !== 'Dibatalkan').length;
  app.innerHTML = demo + `
    <header class="top">
      <div class="top-row">
        <div class="id"><span class="logo sm" role="img" aria-label="Hungry Bird"></span><div><div class="hello">${me()?.supirManual ? esc(state.session.nama) + ', ' + esc(crewLabel() || '-') : 'Halo, ' + esc(state.session.nama)}</div>
             <div class="date">${esc(shortDate(state.today))}</div></div></div>
        <div class="topbtns">
          ${me()?.supirManual ? `<button class="linkbtn" data-act="supir">Ganti kru</button>` : ''}
          <button class="linkbtn" data-act="logout">Ganti kurir</button>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        ${tabBtn('antar','Antar')}${tabBtn('hari','Hari ini ('+n+')')}${tabBtn('riwayat','Riwayat')}
      </nav>
    </header>
    <div id="breakbar"></div>
    <main>${state.tab === 'antar' ? antarHTML() : state.tab === 'hari' ? hariHTML() : riwayatHTML()}</main>`;
  if (state.tab === 'antar') renderCustList();
  renderBreak();
}
const tabBtn = (id, label) => `<button class="tab" role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${esc(label)}</button>`;

function loginHTML(){
  const k = state.pickCourier;
  return `<div class="login">
    <span class="logo" role="img" aria-label="Hungry Bird"></span>
    <div class="brand-sub" style="margin-top:18px">Catatan antar Hungry Bird. Pilih nama kamu untuk mulai.</div>
    <div class="who-list">
      ${state.couriers.length ? state.couriers.map(c => `
        <button class="who-btn" data-courier="${esc(c.id)}" aria-pressed="${k && k.id===c.id}">
          <b>${esc(c.nama)}</b><span>${esc([c.kendaraan, c.divisi].filter(Boolean).join(', '))}</span>
        </button>`).join('') : `<div class="empty">Belum ada kurir. Isi tab Kurir di Google Sheet, lalu muat ulang halaman ini.</div>`}
    </div>
    ${k ? `<div class="field"><label for="pin">PIN ${esc(k.nama)}</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></div>
      <button class="primary" id="login-go" data-act="login">Masuk</button>` : ''}
    ${state.loginErr ? `<div class="err" role="alert">${esc(state.loginErr)}</div>` : ''}
  </div>`;
}

function supirHTML(){
  const same = state.session.supirDate === state.today;
  const cur = same ? state.session.supir : '', cur2 = same ? (state.session.pendamping || '') : '';
  const recent = LS.get('hbd_supir_names', []);
  return `<div class="login">
    <span class="logo" role="img" aria-label="Hungry Bird" style="width:72px;margin-bottom:16px"></span>
    <div class="brand">${esc(state.session.nama)}</div>
    <div class="brand-sub">${esc(shortDate(state.today))}. Siapa yang mengantar hari ini?</div>
    <div class="field"><label for="supir">Nama supir</label>
      <input id="supir" type="text" maxlength="40" autocomplete="off" autocapitalize="words" value="${esc(cur)}" placeholder="Tulis nama supir"></div>
    <div class="field"><label for="pendamping">Nama pendamping <span style="font-weight:400;color:var(--muted)">(kalau berdua)</span></label>
      <input id="pendamping" type="text" maxlength="40" autocomplete="off" autocapitalize="words" value="${esc(cur2)}" placeholder="Kosongkan kalau sendiri"></div>
    ${recent.length ? `<div class="n" style="margin-top:14px;color:var(--muted);font-size:14px">Ketuk nama untuk mengisi:</div>
      <div class="chips">${recent.map(n => `<button class="chip" data-supirname="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
    <button class="primary" data-act="supir-save">Mulai antar</button>
    ${cur ? `<button class="ghost" data-act="supir-cancel">Batal, tetap ${esc([cur, cur2].filter(Boolean).join(' & '))}</button>` : ''}
    <button class="ghost" data-act="logout">Bukan ${esc(state.session.nama)}? Ganti kurir</button>
    ${state.loginErr ? `<div class="err" role="alert">${esc(state.loginErr)}</div>` : ''}
  </div>`;
}

function antarHTML(){
  return `<div class="search">
      <input id="q" type="search" placeholder="Cari customer…" value="${esc(state.search)}" autocomplete="off" aria-label="Cari customer">
      <div class="count" id="count"></div>
    </div>
    <div id="custlist"></div>`;
}
function renderCustList(){
  const box = $('#custlist'); if (!box) return;
  const q = norm(state.search);
  const done = deliveredToday();
  const list = state.customers.filter(c => !q || norm(c.nama + ' ' + c.area + ' ' + c.id).includes(q));
  $('#count').textContent = `${list.length} customer${q ? ' cocok' : ''}`;
  box.innerHTML = list.length ? list.map(c => {
    const d = done[c.id];
    return `<button class="cust" data-cust="${esc(c.id)}">
      <div><div class="name">${esc(c.nama)}</div>
      <div class="sub">${esc(c.area || c.alamat || c.id)}</div></div>
      ${d ? `<span class="minstamp ${d.pending?'pending':''}" title="Sudah diantar hari ini">${esc(d.jam.slice(0,5))}</span>` : ''}
    </button>`;
  }).join('') : `<div class="empty">Tidak ada customer dengan nama itu. Cek ejaan, atau minta admin menambahkannya di tab Customer.</div>`;
}

function entryHTML(e, allowCancel){
  const pills = [];
  if (e.pending) pills.push(e.error ? `<span class="pill danger">Gagal: ${esc(e.error)}</span>` : `<span class="pill warn">Menunggu sinyal</span>`);
  if (e.status === 'Dibatalkan') pills.push(`<span class="pill danger">Dibatalkan</span>`);
  else if (e.cek){
    const cls = /^Sesuai|^Titik baru/.test(e.cek) ? 'ok' : /^Jauh|^Tanpa/.test(e.cek) ? 'warn' : '';
    pills.push(`<span class="pill ${cls}">${esc(e.cek)}</span>`);
  }
  let action = '';
  if (e.pending) action = `<button class="smallbtn" data-drop="${esc(e.uid)}">Hapus</button>`;
  else if (allowCancel && e.status === 'Terkirim' && e.serverTs && Date.now() - e.serverTs < BATAL_MENIT*60000)
    action = `<button class="smallbtn" data-cancel="${esc(e.uid)}">Batalkan</button>`;
  return `<div class="entry ${e.status==='Dibatalkan'?'void':''}">
    <div class="t">${esc(e.jam.slice(0,5))}</div>
    <div><div class="c">${esc(e.customer)}</div>
      ${e.penerima ? `<div class="n">Diterima: ${esc(e.penerima)}</div>` : ''}
      ${e.catatan ? `<div class="n">${esc(e.catatan)}</div>` : ''}
      ${e.supir ? `<div class="n">Supir: ${esc(e.supir)}${e.pendamping ? ', pendamping: ' + esc(e.pendamping) : ''}</div>` : ''}
      ${pills.length ? `<div class="pills">${pills.join('')}</div>` : ''}</div>
    <div>${action}</div>
  </div>`;
}

function hariHTML(){
  const list = todayMerged();
  const n = list.filter(e => e.status !== 'Dibatalkan').length;
  return `<div class="list-head"><b>${n} kiriman hari ini</b>
      ${state.queue.length ? `<button class="smallbtn" data-act="flush" style="color:var(--ink)">Kirim ulang</button>` : ''}</div>
    ${list.length ? list.map(e => entryHTML(e, true)).join('') : `<div class="empty">Belum ada kiriman hari ini. Buka tab Antar dan pilih customer setelah pesanan diterima.</div>`}`;
}

function riwayatHTML(){
  const d = state.histDate || state.today;
  const n = state.histList.filter(e => e.status !== 'Dibatalkan').length;

      <b>${state.histLoading ? 'Memuat…' : n + ' kiriman'}</b>

function renderBreak(){
  const bar = $('#breakbar'); if (!bar || !state.session) return;
  brkReset();
  const a = state.brk.active, names = crew();
  const all = a && names.every(onBreak);
  // Seluruh kru istirahat → layar istirahat penuh (catat kiriman dikunci)
  let view = $('#breakwrap');
  if (all && !view){
    view = document.createElement('div'); view.id = 'breakwrap';
    document.body.appendChild(view);
  }
  if (!all && view) view.remove();
  if (all){
    const low = Math.min(...a.names.map(remainingSec));
    const endAt = new Date(a.startAt + Math.min(...a.names.map(n => (JATAH - usedMin(n)) * 60000)));
    view.innerHTML = `<div class="breakview" role="dialog" aria-modal="true" aria-label="Sedang istirahat">
      <div class="lbl">${low >= 0 ? 'Sisa istirahat' : 'Istirahat lewat batas'}</div>
      <div class="clock ${low < 0 ? 'over' : low < 300 ? 'warn' : ''}" id="bclock">${fmtClock(low)}</div>
      <div class="sub">${low >= 0 ? `Kembali paling lambat pukul <b>${esc(hms(endAt).slice(0,5))}</b>` : 'Segera kembali bekerja'}</div>
      <div class="names"><div id="bnames">${breakNames(a)}</div>
        <div>Mulai ${esc(hms(new Date(a.startAt)).slice(0,5))}</div></div>
      <button class="primary" data-act="break-end">Selesai istirahat</button>
    </div>`;
    bar.innerHTML = '';
    return;
  }
  if (a){
    const low = Math.min(...a.names.map(remainingSec));
    bar.className = 'breakbar ' + (low < 0 ? 'over' : 'on');
    bar.innerHTML = `<div class="bl"><b>${esc(a.names.join(' & '))} istirahat, ${esc(fmtMin(low))}</b><br>Mulai ${esc(hms(new Date(a.startAt)).slice(0,5))}</div>
      <button class="bbtn solid" data-act="break-end">Selesai</button>`;
    return;
  }
  bar.className = 'breakbar';
  bar.innerHTML = `<div class="bl">Istirahat hari ini<br><b>${names.map(n => (names.length > 1 ? esc(n) + ' ' : '') + esc(fmtMin(remainingSec(n)))).join(', ')}</b></div>
    <button class="bbtn" data-act="break-open">Istirahat</button>`;
}

function breakNames(a){ return a.names.length > 1 ? a.names.map(n => `${esc(n)}: ${esc(fmtMin(remainingSec(n)))}`).join('<br>') : ''; }

function openBreakSheet(){
  if (needSupir()){ state.screen = 'supir'; return render(); }
  const names = crew();
  const div = document.createElement('div'); div.id = 'brksheet';
  div.innerHTML = `<div class="scrim" data-act="break-close"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="bk-t">
      <h2 id="bk-t">Mulai istirahat</h2>
      <div class="addr">Jatah ${JATAH} menit per orang per hari, boleh dipecah beberapa kali.</div>
      <div style="margin-top:10px">${names.map((n, i) => `
        <label class="check"><input type="checkbox" name="bk" value="${esc(n)}" checked ${names.length === 1 ? 'disabled' : ''}>
          <span>${esc(n)}</span><span class="rest">${esc(fmtMin(remainingSec(n)))}</span></label>`).join('')}</div>
      ${names.length > 1 ? `<div class="addr" style="margin-top:8px">Hapus centang kalau hanya satu orang yang istirahat.</div>` : ''}
      <button class="primary" data-act="break-start">Mulai istirahat</button>
      <button class="ghost" data-act="break-close">Batal</button>
    </section>`;

}

let audioCtx = null;
async function startBreak(){
  const names = [...document.querySelectorAll('input[name=bk]')].filter(x => x.checked).map(x => x.value);
  if (!names.length) return toast('Pilih siapa yang istirahat.');
  const habis = names.filter(n => remainingSec(n) <= 0);
  if (habis.length && !confirm(`Jatah istirahat ${habis.join(' & ')} sudah habis. Tetap mulai? Waktunya akan tercatat lewat batas.`)) return;
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); }catch{}
  askNotif();
  const btn = document.querySelector('[data-act="break-start"]'); if (btn){ btn.disabled = true; btn.textContent = 'Memulai…'; }
  const pos = await quickFix(3000);
  const now = Date.now(), uid = uuid();
  // Tandai ambang yang sudah terlewati supaya tidak langsung berbunyi
  const alerted = [];
  for (const n of names) for (const m of [10, 5, 0]) if (remainingSec(n) <= m * 60) alerted.push(n + '|' + m);
  state.brk.active = { uid, names, startAt: now, alerted };
  saveBrk();
  state.queue.push({ qid: uuid(), action: 'breakStart', uid, kurirId: state.session.kurirId, names, startAt: new Date(now).toISOString(), lat: pos?.lat ?? null, lng: pos?.lng ?? null });
  saveQueue();
  $('#brksheet')?.remove();
  render();
  flushQueue();
}

function endBreak(){
  const a = state.brk.active; if (!a) return;
  const now = Date.now();
  const mins = Math.max(1, Math.ceil((now - a.startAt) / 60000));   // sama dengan server: per menit, dibulatkan ke atas
  for (const n of a.names) state.brk.used[n.toLowerCase()] = usedMin(n) + mins;
  state.brk.active = null; saveBrk();
  state.queue.push({ qid: uuid(), action: 'breakEnd', uid: a.uid, kurirId: state.session.kurirId, endAt: new Date(now).toISOString() });
  saveQueue();
  $('#breakwrap')?.remove();
  toast(`Istirahat ${mins} menit. ` + a.names.map(n => (a.names.length > 1 ? n + ' ' : '') + fmtMin(remainingSec(n))).join(', ') + '.');
  render();
  flushQueue();
}

function quickFix(ms){
  return new Promise(res => {
    if (!('geolocation' in navigator)) return res(null);
    const t = setTimeout(() => res(null), ms);
    navigator.geolocation.getCurrentPosition(p => { clearTimeout(t); res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6) }); },
      () => { clearTimeout(t); res(null); }, { enableHighAccuracy: true, maximumAge: 60000, timeout: ms });
  });
}

/* Notifikasi sisa waktu: bunyi + getar + notifikasi HP (kalau diizinkan) */
let swReg = null;
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(() => {});
function askNotif(){ try{ if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); }catch{} }
function beep(){
  try{
    if (!audioCtx) return; audioCtx.resume?.();
    [0, 0.35, 0.7].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.25, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.25);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.26);
    });
  }catch{}
}
function notify(title, body){
  toast(title + '. ' + body);
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  beep();
  try{
    if ('Notification' in window && Notification.permission === 'granted'){
      const opt = { body, tag: 'hb-istirahat', renotify: true, icon: document.querySelector('link[rel=apple-touch-icon]')?.href };
      if (swReg) swReg.showNotification(title, opt); else new Notification(title, opt);
    }
  }catch{}
}
function breakTick(){
  const a = state.brk.active;
  if (!a || !state.session) return;
  if (state.brk.date !== ymd(new Date())) return;   // ganti hari ditangani visibilitychange
  for (const m of [10, 5, 0]){
    const who = a.names.filter(n => remainingSec(n) <= m * 60 && !a.alerted.includes(n + '|' + m));
    if (!who.length) continue;
    who.forEach(n => a.alerted.push(n + '|' + m)); saveBrk();
    const siapa = a.names.length > 1 ? who.join(' & ') + ': ' : '';
    if (m > 0) notify(`Sisa istirahat ${m} menit`, `${siapa}siap-siap kembali, ya.`);
    else notify('Waktu istirahat habis', `${siapa}jatah ${JATAH} menit hari ini sudah terpakai. Tekan Selesai istirahat.`);
  }
  const clock = $('#bclock');
  if (clock){
    const low = Math.min(...a.names.map(remainingSec));
    clock.textContent = fmtClock(low);
    clock.className = 'clock ' + (low < 0 ? 'over' : low < 300 ? 'warn' : '');
    const bn = $('#bnames'); if (bn) bn.innerHTML = breakNames(a);
    if (low < 0 && !clock.dataset.over){ clock.dataset.over = 1; renderBreak(); }
  } else if (Date.now() % 15000 < 1000) renderBreak();
  document.title = `☕ ${fmtClock(Math.min(...a.names.map(remainingSec)))} · HB Delivery`;
}
setInterval(() => { breakTick(); if (!state.brk.active && document.title !== 'Hungry Bird Delivery') document.title = 'Hungry Bird Delivery'; }, 1000);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-cust],[data-courier],[data-cancel],[data-drop],[data-supirname],[data-penerima]');
  if (!t) return;
  if (t.dataset.tab){
    state.tab = t.dataset.tab; render();
    if (state.tab === 'hari') loadToday();
    if (state.tab === 'riwayat') loadHistory(state.histDate || state.today);
    return;
  }
  if (t.dataset.cust){ const c = state.customers.find(x => x.id === t.dataset.cust); if (c) openSheet(c); return; }
  if (t.dataset.courier){ state.pickCourier = state.couriers.find(x => x.id === t.dataset.courier); state.loginErr=''; render(); setTimeout(()=>$('#pin')?.focus(), 30); return; }
  if (t.dataset.supirname){
    const a = $('#supir'), b2 = $('#pendamping'), n = t.dataset.supirname;
    const target = !a.value.trim() ? a : (!b2.value.trim() && a.value.trim().toLowerCase() !== n.toLowerCase()) ? b2 : null;
    if (target) target.value = n; else toast('Kosongkan salah satu kolom dulu.');
    return;
  }
  if (t.dataset.penerima){ const i = $('#penerima'); i.value = t.dataset.penerima; $('#f-penerima').classList.remove('bad'); $('#f-penerima .hint')?.remove(); return $('#note').focus(); }
  if (t.dataset.cancel) return cancelEntry(t.dataset.cancel);
  if (t.dataset.drop) return dropPending(t.dataset.drop);
  switch (t.dataset.act){
    case 'close': return closeSheet();
    case 'deliver': return markDelivered();
    case 'stamp-done': $('#stampwrap')?.remove(); state.tab = 'antar'; state.search = ''; return render();
    case 'login': return doLogin();
    case 'supir': state.loginErr = ''; state.screen = 'supir'; return render();
    case 'break-open': return openBreakSheet();
    case 'break-close': return $('#brksheet')?.remove();
    case 'break-start': return startBreak();
    case 'break-end': return endBreak();
    case 'supir-save': return saveSupir();
    case 'supir-cancel': state.screen = 'main'; return render();
    case 'logout': if (state.brk.active) return toast('Selesaikan istirahat dulu sebelum ganti kurir.');
      if (!state.queue.length || confirm('Masih ada kiriman yang belum terkirim ke server. Tetap ganti kurir?')) logout(); return;
    case 'flush': flushQueue().then(() => toast(state.queue.length ? 'Masih ada yang belum terkirim.' : 'Semua sudah terkirim.')); return;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q'){ state.search = e.target.value; renderCustList(); }
  if (e.target.id === 'penerima' && e.target.value.trim()){ $('#f-penerima')?.classList.remove('bad'); $('#f-penerima .hint')?.remove(); }
});
document.addEventListener('change', e => {

document.addEventListener('keydown', e => {

/* ====================== MODE DEMO ======================
   Hanya dipakai kalau API_URL belum diisi. Meniru perilaku Apps Script. */
function demoApi(action, b){
  const db = demoApi.db || (demoApi.db = {
    couriers: [
      { id:'K-01', nama:'Kurir Mobil 1', kendaraan:'Mobil', divisi:'Semua', pin:'1234', supirManual:true },
      { id:'K-02', nama:'Kurir Mobil 2', kendaraan:'Mobil', divisi:'Semua', pin:'1234', supirManual:true },
      { id:'K-03', nama:'Kurir Motor Kopi', kendaraan:'Motor', divisi:'Hungry Bird', pin:'1234' },
      { id:'K-04', nama:'Kurir Motor Pastry', kendaraan:'Motor', divisi:'Lazy Hands', pin:'1234' }
    ],
    customers: ['12bArs Coffeeshop','A Bit More','Acai Shop','Bali de Uma','Bam Bam Padel Ubud','Capucine Bakery','Dawn Canggu','Doppio Cafe','Dulu Coffee Canggu','Flock Ubud','Goemerot Jimbaran','Hygge Coffee','Kabak Cafe','Little Ripper Bali']
      .map((n,i) => ({ id:'C-'+String(i+1).padStart(3,'0'), nama:n, area:'', alamat:'', lat:null, lng:null })),
    log: [], breaks: []
  });
  const wait = sleep(350);
  const auth = () => { const k = db.couriers.find(c => c.id === b.kurirId); if (!k || k.pin !== String(b.pin)) { const e = new Error('PIN salah.'); e.server = true; throw e; } return k; };
  return wait.then(() => {
    if (action === 'init') return { ok:true, customers: db.customers, couriers: db.couriers.map(({pin, ...c}) => c) };
    if (action === 'login'){ const k = auth(); return { ok:true, kurir:{ id:k.id, nama:k.nama } }; }
    const info = (k, date) => {
      const used = {}; let active = null;
      for (const r of db.breaks.filter(r => r.tanggal === date)){
        if (r.status === 'Selesai') used[r.nama.toLowerCase()] = (used[r.nama.toLowerCase()] || 0) + r.durasi;
        if (r.status === 'Berjalan' && r.kurirId === k.id){ active = active || { uid:r.uid, names:[], startAt:r.startAt }; if (active.uid === r.uid) active.names.push(r.nama); }
      }
      return { jatah:60, used, active };
    };
    if (action === 'list'){ const k = auth(); return { ok:true, entries: db.log.filter(e => e.kurirId === b.kurirId && e.tanggal === b.date), breaks: info(k, b.date) }; }
    if (action === 'breakStart'){ const k = auth(); const t = new Date(b.startAt);
      if (!db.breaks.some(r => r.uid === b.uid)) b.names.forEach(n => db.breaks.push({ uid:b.uid, tanggal:ymd(t), kurirId:k.id, nama:n, startAt:t.getTime(), status:'Berjalan', durasi:0 }));
      return { ok:true, breaks: info(k, ymd(t)) }; }
    if (action === 'breakEnd'){ const k = auth(); const end = new Date(b.endAt).getTime(); let tgl = ymd(new Date(end));
      db.breaks.filter(r => r.uid === b.uid && r.status === 'Berjalan').forEach(r => { r.status = 'Selesai'; r.durasi = Math.max(1, Math.ceil((end - r.startAt)/60000)); tgl = r.tanggal; });
      return { ok:true, breaks: info(k, tgl) }; }
    if (action === 'deliver'){
      const k = auth(); const dup = db.log.find(e => e.uid === b.uid); if (dup) return { ok:true, entry:dup };
      const c = db.customers.find(x => x.id === b.customerId);
      let cek = 'Tanpa GPS';
      if (b.lat != null){ if (c.lat == null && b.acc <= 100){ c.lat = b.lat; c.lng = b.lng; cek = 'Titik baru disimpan'; } else cek = 'Sesuai titik'; }
      const entry = { uid:b.uid, tanggal:b.tanggal, jam:b.jam, kurirId:k.id, kurir:k.nama, supir:b.supir||'', pendamping:b.pendamping||'', customerId:c.id, customer:c.nama, catatan:b.catatan, penerima:b.penerima, cek, status:'Terkirim', serverTs:Date.now() };
      db.log.push(entry); return { ok:true, entry };
    }
    if (action === 'cancel'){ auth(); const e = db.log.find(x => x.uid === b.uid); e.status = 'Dibatalkan'; return { ok:true, entry:e }; }
  });
}
</script>
